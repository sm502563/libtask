<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>图书馆整架岗任务板</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#f2f4f8}
#app{position:fixed;left:0;top:0;width:100%;height:100%;border:0}
#tip{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;color:#666;background:#f2f4f8;font:14px/1.6 sans-serif}
</style>
</head>
<body>
<iframe id="app" title="任务板"></iframe>
<div id="tip">任务板加载中…</div>
<script>
(function(){
  var tip=document.getElementById('tip');
  fetch('https://textdb.online/tbpage_libtask_v1',{cache:'no-store'})
    .then(function(r){if(!r.ok)throw 0;return r.text()})
    .then(function(t){
      if(t.indexOf('<!DOCTYPE html>')!==0||t.length<20000)throw 0;
      document.getElementById('app').srcdoc=t;
      setTimeout(function(){tip.style.display='none'},1200);
    })
    .catch(function(){
      tip.textContent='加载失败，请检查网络后点击屏幕重试';
      document.body.addEventListener('click',function(){location.reload()},{once:true});
    });
})();
</script>
</body>
</html>
