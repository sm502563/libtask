<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101623">
<title>勤助任务榜 · 图书馆整架岗</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="任务榜">
<style>
:root{
  --gold:#b9934d; --gold2:#f0d491; --jade:#5fb894; --jade2:#8fd8b8;
  --bg0:#101623; --bg1:#0d1320; --card:#18243a; --card2:#1e2b44;
  --line:rgba(185,147,77,.28); --line2:rgba(185,147,77,.16);
  --txt:#e7eaf3; --sub:#939db4; --goldtxt:#e8cf9a;
  --red:#e07a6a; --green:#6fcf97; --blue:#7aa5e0;
  --radius:10px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 500px at 50% -160px, rgba(185,147,77,.14), transparent 60%),
    radial-gradient(700px 420px at 110% 18%, rgba(95,184,148,.07), transparent 60%),
    radial-gradient(700px 420px at -10% 40%, rgba(185,147,77,.05), transparent 60%),
    linear-gradient(180deg, var(--bg0), var(--bg1) 55%, #0a0e18);
  background-attachment:fixed;
  color:var(--txt); max-width:640px; margin:0 auto;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.55; padding-bottom:calc(66px + var(--safe-b));
}
body::before{content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; background-image:var(--u-bg); background-size:cover; background-position:center top; background-repeat:no-repeat; opacity:.11}
.tico{display:block; width:21px; height:21px; margin:0 auto 2px; background-position:center; background-size:contain; background-repeat:no-repeat; opacity:.92}
.tico-board{background-image:var(--u-bh)}
.tico-pub{background-image:var(--u-ql)}
.tico-mine{background-image:var(--u-xw)}
.tico-set{background-image:var(--u-zq)}
.h-title{display:flex; align-items:center; text-align:left}
.ecrane{display:block; width:170px; margin:-6px auto 4px; opacity:.92}
.xf-serif{font-family:"STKaiti","KaiTi","Kaiti SC","BiauKai","Noto Serif SC",serif}
button{font-family:inherit; border:none; cursor:pointer; background:none; color:inherit}
input,textarea,select{font-family:inherit; font-size:15px; outline:none}
img{display:block}

/* ---------- settings fold ---------- */
details.fold{border-top:1px dashed rgba(185,147,77,.18); margin-top:2px}
details.fold:first-of-type{border-top:none}
details.fold>summary{list-style:none; cursor:pointer; padding:11px 2px 10px; font-size:14px; color:var(--gold2); position:relative; padding-right:26px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'›'; position:absolute; right:6px; top:50%; transform:translateY(-50%) rotate(90deg); color:rgba(185,147,77,.5); transition:transform .2s; font-size:16px}
details.fold[open]>summary::after{transform:translateY(-50%) rotate(-90deg)}
.duty-card>summary{padding:11px 26px 9px 2px}
.duty-card .sum-t{display:block; color:var(--gold2); font-weight:600; font-size:15px; letter-spacing:1px}
.duty-card .sum-s{display:block; font-size:12px; color:rgba(185,147,77,.78); margin-top:2px}
.duty-card .d-nm{display:flex; align-items:baseline; gap:8px; line-height:1.65}
.duty-card .d-ph{font-size:12px; color:rgba(185,147,77,.85); text-decoration:none}
.duty-card .d-ph:active{color:var(--gold2)}
details.fold .fold-b{padding:2px 2px 12px; animation:foldIn .25s ease}
.me-head{font-size:15px; color:var(--gold2); font-weight:700; letter-spacing:2px; font-family:"STKaiti","KaiTi","Kaiti SC",serif; margin-bottom:2px}
details.fold details.fold{margin-top:6px}
details.fold details.fold>summary{font-size:13px; color:rgba(212,178,106,.85); padding:9px 26px 8px 10px}
details.fold details.fold>summary::after{font-size:14px}
@keyframes foldIn{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:none}}
.fold-b .hint{margin-bottom:6px}
.fold-b.about b{color:var(--gold2)}
.fold-b.about{font-size:12.5px; color:var(--sub); line-height:1.8}

/* ---------- 技术开发 · 技术支持 ---------- */
.sup-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line)}
.sup-row:last-of-type{border-bottom:none}
.sup-role{flex:none; font-size:11px; letter-spacing:2px; color:var(--gold2); border:1px solid rgba(185,147,77,.4); border-radius:6px; padding:2px 8px}
.sup-name{font-size:15px; font-weight:700; color:var(--txt); font-family:"STKaiti","KaiTi",serif; letter-spacing:2px}
.sup-qq{margin-left:auto; font-size:12.5px; color:var(--blue); background:rgba(122,165,224,.08); border:1px solid rgba(122,165,224,.3); border-radius:8px; padding:5px 10px; letter-spacing:.5px}
.sup-qq:active{background:rgba(122,165,224,.22)}

/* ---------- header ---------- */
header{
  background-image:var(--u-hd),linear-gradient(180deg, rgba(24,32,50,.96), rgba(16,22,35,.92));
  background-size:100% 100%,auto; background-position:center,center; background-repeat:no-repeat,no-repeat;
  border-bottom:1px solid var(--line);
  color:var(--txt); padding:24px 16px 4px; position:sticky; top:0; z-index:50;
  box-shadow:0 4px 18px rgba(0,0,0,.45);
}
.h-row{display:flex; align-items:center; justify-content:space-between; position:relative; gap:10px; margin-bottom:8px}
.h-title{
  font-size:22px; font-weight:700; letter-spacing:5px; color:var(--gold2); text-align:left; padding:0;
  font-family:"STKaiti","KaiTi","Kaiti SC","Noto Serif SC",serif;
  text-shadow:0 0 14px rgba(185,147,77,.35);
}
.h-sub{font-size:12px; color:rgba(185,147,77,.75); margin-top:3px; letter-spacing:3px; text-align:left; white-space:nowrap}
.sync{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--sub); white-space:nowrap}
.dot{width:8px; height:8px; border-radius:50%; background:var(--jade2); box-shadow:0 0 8px rgba(143,216,184,.7)}
.dot.busy{background:var(--gold2); box-shadow:0 0 8px rgba(240,212,145,.7); animation:pulse 1s infinite}
.dot.err{background:var(--red); box-shadow:0 0 8px rgba(224,122,106,.7)}
@keyframes pulse{50%{opacity:.35}}
.date-strip{display:flex; gap:8px; overflow-x:auto; padding:4px 16px 6px; scrollbar-width:none}
.date-strip::-webkit-scrollbar{display:none}
.chip{
  flex:none; position:relative; padding:5px 13px; border-radius:999px; background:rgba(185,147,77,.08);
  color:rgba(234,228,211,.8); font-size:13px; --cb:var(--line2);
}
.chip::before{
  content:''; position:absolute; inset:0; border-radius:999px; pointer-events:none;
  border:1px solid var(--cb);
  -webkit-mask-image:linear-gradient(180deg,#000 45%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 45%,transparent 100%);
}
.chip.on{background:linear-gradient(135deg,#3a3323,#2a2418); color:var(--gold2); font-weight:600; --cb:var(--gold); box-shadow:0 0 12px rgba(185,147,77,.25)}
.chip .d-lab{opacity:.75; margin-right:4px; font-size:12px}

/* ---------- tabs ---------- */
nav.tabbar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:640px;
  background:rgba(13,18,30,.97); border-top:1px solid var(--line); display:flex; z-index:60;
  padding-bottom:var(--safe-b); backdrop-filter:blur(8px);
}
.tab{flex:1; text-align:center; padding:9px 0 7px; color:var(--sub); font-size:11px; position:relative}
.tab svg{width:22px; height:22px; margin:0 auto 2px; display:block; stroke:currentColor; fill:none; stroke-width:1.8}
.tab.on{color:var(--gold2); font-weight:600; text-shadow:0 0 10px rgba(185,147,77,.4)}
.tab .t-badge{position:absolute; top:6px; right:calc(50% - 20px); background:var(--red); color:#fff; font-size:10px; border-radius:8px; padding:0 4px; min-width:14px}

/* ---------- 页签圆形扩散转场：旧页快照 + 金色描边扩散环 + 星星点点 ---------- */
.tab-ghost{position:fixed; z-index:40; pointer-events:none; margin:0}
.tab-ring{
  position:fixed; z-index:41; pointer-events:none; border-radius:50%;
  border:1.5px solid rgba(240,212,145,.32);
  box-shadow:0 0 14px rgba(240,212,145,.18), inset 0 0 14px rgba(240,212,145,.12);
}
.tab-star{
  position:fixed; z-index:42; pointer-events:none; color:rgba(240,212,145,.5); line-height:1;
  text-shadow:0 0 6px rgba(240,212,145,.4);
  animation:tabStar .64s ease-out forwards;
}
@keyframes tabStar{from{opacity:1; transform:translate(0,0) scale(1) rotate(0deg)}to{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.3) rotate(90deg)}}

/* ---------- main / cards ---------- */
main{padding:14px 15px 6px}
.card{
  background-image:var(--u-card),linear-gradient(160deg, rgba(185,147,77,.05), transparent 40%);
  background-size:100% auto,auto; background-position:center top,center; background-repeat:repeat-y,no-repeat;
  background-color:var(--card);
  border:1px solid var(--line2); border-radius:var(--radius); padding:14px; margin-bottom:18px;
  box-shadow:0 2px 12px rgba(0,0,0,.35), inset 0 0 0 1px rgba(185,147,77,.07); position:relative;
}

/* ---------- 最底层：社会主义核心价值观（背景暗纹 + 页脚） ---------- */
.vals-bg{
  position:fixed; left:0; right:0; top:44%; transform:translateY(-50%); z-index:-1;
  pointer-events:none; text-align:center; user-select:none;
}
.vals-bg div{
  font-family:"STKaiti","KaiTi","Noto Serif SC",serif; font-size:19px; letter-spacing:7px;
  color:rgba(185,147,77,.09); line-height:2.2; text-shadow:0 0 14px rgba(185,147,77,.12);
}
.page-ft{margin:10px 15px calc(76px + var(--safe-b, 0px)); text-align:center}
.page-ft .ft-line{height:1px; background:linear-gradient(90deg, transparent, rgba(185,147,77,.42), transparent); margin-bottom:15px}
.page-ft .ft-row{display:flex; justify-content:center; gap:16px; margin:8px 0}
.page-ft .ft-row span{
  font-family:"STKaiti","KaiTi","Noto Serif SC",serif; font-size:14px; font-weight:600; letter-spacing:5px; padding-left:5px;
  color:rgba(185,147,77,.68); text-shadow:0 0 10px rgba(185,147,77,.18);
}
.page-ft .ft-cap{margin-top:13px; font-size:10.5px; letter-spacing:3.5px; color:rgba(147,157,180,.5)}
.card::before{
  content:''; position:absolute; left:10px; right:10px; top:0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(185,147,77,.35), transparent);
}
.empty{text-align:center; color:var(--sub); padding:36px 0; font-size:14px}
.day-head{display:block; margin:6px 2px 12px; padding-bottom:14px; background:var(--u-div) bottom center/100% 12px no-repeat; font-size:13px; color:var(--sub)}
.day-head .day-row{display:flex; align-items:center; justify-content:space-between; gap:10px}
.day-head .day-stat{margin-top:3px}
.day-head .leave-link{
  display:inline-flex; align-items:center;
  font-size:12.5px; font-weight:700; color:var(--gold2); letter-spacing:.5px;
  background:linear-gradient(135deg, rgba(185,147,77,.20), rgba(185,147,77,.07));
  border:1px solid rgba(185,147,77,.5); border-radius:999px;
  padding:2px 11px; transform:translate(-18px, 6px);
}
.day-head .leave-link:active{background:rgba(185,147,77,.32)}
.day-head b{
  display:flex; align-items:center; gap:8px;
  color:var(--gold2); font-size:15px; letter-spacing:1px;
  font-family:"STKaiti","KaiTi",serif;
}
.day-head b::before{content:''; width:3px; height:16px; border-radius:2px; background:linear-gradient(180deg, var(--gold2), rgba(185,147,77,.45))}
.stat-line{font-size:12px; color:rgba(185,147,77,.65)}
.t-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.room-tag{
  display:inline-block; background:linear-gradient(135deg,#403826,#2b2517);
  color:var(--gold2); font-size:13px; font-weight:600;
  padding:3px 10px; border-radius:8px; letter-spacing:.5px;
  border:1px solid rgba(185,147,77,.4);
  font-family:"STKaiti","KaiTi",serif;
}
.rn{color:#e0896f; font-weight:700; padding:0 1px}
.h-right{display:flex; flex-direction:row; align-items:center; gap:12px; flex:none; transform:translateY(-6px); margin-right:12px}
.nbell{
  position:relative; font-size:19px; line-height:1; padding:4px 2px; display:inline-block;
  transform-origin:50% 82%; -webkit-tap-highlight-color:transparent;
  animation:bellBreath 2.8s ease-in-out infinite; /* 常态：慢呼吸 */
}
.nbell.has-unread{animation-name:bellBreathOn; animation-duration:1.8s} /* 有未读：轻摇铃 */
@keyframes bellBreath{
  0%,100%{transform:scale(1) rotate(0deg); filter:drop-shadow(0 0 0 rgba(240,212,145,0))}
  35%{transform:scale(1.48) rotate(-8deg); filter:drop-shadow(0 0 26px rgba(240,212,145,1))}
  60%{transform:scale(1.4) rotate(7deg); filter:drop-shadow(0 0 20px rgba(240,212,145,.8))}
}
@keyframes bellBreathOn{
  0%,100%{transform:scale(1) rotate(0deg); filter:drop-shadow(0 0 0 rgba(240,212,145,0))}
  35%{transform:scale(1.62) rotate(-13deg); filter:drop-shadow(0 0 30px rgba(240,212,145,1))}
  70%{transform:scale(1.4) rotate(12deg); filter:drop-shadow(0 0 24px rgba(240,212,145,.9))}
}
@media (prefers-reduced-motion:reduce){.nbell{animation:none}}
.n-dot{position:absolute; top:-5px; right:-8px; background:var(--red); color:#fff; font-size:9.5px; min-width:15px; height:15px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; padding:0 3px; font-weight:700}
.leave-card .leave-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:7px 0; border-bottom:1px dashed var(--line); font-size:14px}
.leave-card .leave-row:last-of-type{border-bottom:none}
.lv-date{color:var(--gold2); font-size:12.5px}
.lv-st{margin-left:auto; font-size:12px; color:var(--sub)}
.lv-st.open{color:#d98e4a; font-weight:600}
.ntf-row{padding:9px 2px; border-bottom:1px dashed var(--line); font-size:14px; line-height:1.5}
.ntf-click{cursor:pointer}
.ntf-click:active{background:rgba(185,147,77,.05)}
.ntf-head{display:flex; align-items:center; gap:8px}
.ntf-t{font-size:11px; color:var(--sub); margin-right:auto}
.ntf-pin{font-size:10px; color:var(--gold2); border:1px solid rgba(185,147,77,.5); border-radius:4px; padding:0 4px; flex:none}
.ntf-x{border:none; background:none; color:rgba(224,137,111,.55); font-size:11.5px; cursor:pointer; padding:2px 4px; flex:none}
.ntf-x:active{color:#e0896f}
.ntf-preview{background:rgba(185,147,77,.06); border:1px solid var(--line2); border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.6; margin:0 0 12px}
.duty-card .duty-row{display:flex; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13.5px; align-items:baseline}
.duty-card .duty-row:last-child{border-bottom:none}
.duty-room{flex:none; width:118px; color:var(--gold2)}
.duty-names{flex:1; line-height:1.6}
.lv-tag{display:inline-block; background:rgba(143,216,184,.15); color:var(--jade2); font-size:10.5px; border-radius:6px; padding:0 4px; margin-left:3px; vertical-align:1px}
.badge{font-size:11.5px; padding:2.5px 9px; border-radius:999px; font-weight:600; flex:none; white-space:nowrap; border:1px solid transparent}
.b-open{background:rgba(240,212,145,.12); color:var(--gold2); border-color:rgba(240,212,145,.35)}
.b-claimed{background:rgba(122,165,224,.12); color:var(--blue); border-color:rgba(122,165,224,.35)}
.b-done{background:rgba(143,216,184,.12); color:var(--jade2); border-color:rgba(143,216,184,.35)}
.b-verified{background:rgba(185,147,77,.14); color:var(--gold2); border-color:rgba(185,147,77,.45); box-shadow:0 0 10px rgba(185,147,77,.15)}
.b-rejected{background:rgba(224,122,106,.12); color:var(--red); border-color:rgba(224,122,106,.35)}
.t-desc{margin:9px 0 2px; white-space:pre-wrap; word-break:break-word}
.t-meta{font-size:12px; color:var(--sub); margin-top:6px; display:flex; flex-wrap:wrap; gap:4px 12px}
.t-meta .warn{color:var(--red); font-weight:600}
.photos{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.photos img{width:86px; height:86px; object-fit:cover; border-radius:10px; border:1px solid var(--line); cursor:zoom-in; background:#2e2820}
.photos img.ph-bad{opacity:.45}
/* 内置相机（学生现场拍摄专用，绕开系统相册） */
.camovl{position:fixed; inset:0; z-index:500; background:#000; display:flex; align-items:center; justify-content:center}
.cambox{width:100%; max-width:520px}
.cambox video{width:100%; max-height:70vh; object-fit:contain; background:#111; display:block}
.camrow{display:flex; gap:12px; justify-content:center; padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
.camtip{color:#a89b85; font-size:12.5px; text-align:center; padding-bottom:4px}
.divi{border-top:1px dashed var(--line2); margin:12px -14px 10px}
.dlv{margin-top:4px}
.dlv-row{display:flex; justify-content:space-between; align-items:center; gap:8px}
.dlv-note{font-size:13.5px; color:rgba(234,228,211,.85); margin:6px 0 0; white-space:pre-wrap; word-break:break-word}
.dlv-time{font-size:12px; color:var(--sub); margin-top:6px}
.dlv-time.late-ok{color:var(--jade2)}
.dlv-time.late-bad{color:var(--red); font-weight:600}
.btnrow{display:flex; gap:10px; margin-top:12px}
.btn{
  flex:1; text-align:center; padding:9px 0; border-radius:10px; font-size:14px; font-weight:600;
  border:1px solid var(--line); background:rgba(185,147,77,.06); color:var(--txt);
}
.btn.primary{
  background:linear-gradient(135deg,#4a4130,#332c1e); color:var(--gold2);
  border-color:var(--gold); box-shadow:0 0 14px rgba(185,147,77,.18);
}

/* ---------- 完成反馈按钮：收缩成圆 + 对勾一笔画出 + 粒子迸发 ---------- */
.btn.donefx{position:relative; transition:width .26s cubic-bezier(.55,0,.15,1), border-radius .26s ease, color .18s}
.btn.donefx.fx{overflow:hidden; color:transparent !important; white-space:nowrap}
.dfx-svg{position:absolute; left:50%; top:50%; width:24px; height:24px; margin:-12px 0 0 -12px; opacity:0; transition:opacity .15s}
.fx > .dfx-svg{opacity:1}
.dfx-svg path{fill:none; stroke:var(--gold2); stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:34; stroke-dashoffset:34; animation:dfxDraw .42s ease-out .2s forwards}
@keyframes dfxDraw{to{stroke-dashoffset:0}}
.dfx-p{position:fixed; z-index:320; width:5px; height:5px; margin:-2px 0 0 -2px; border-radius:50%; pointer-events:none; animation:dfxPop .62s cubic-bezier(.2,.6,.35,1) forwards}
@keyframes dfxPop{from{opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.25); opacity:0}}
.btn.orange{
  background:linear-gradient(135deg,#3c5a4c,#28403a); color:var(--jade2);
  border-color:rgba(143,216,184,.5); box-shadow:0 0 12px rgba(95,184,148,.15);
}
.btn.ghost{background:rgba(168,155,133,.08); color:var(--sub); font-weight:500}
.btn.mini{flex:none; padding:6px 14px; font-size:13px; border-radius:9px}
.btn.danger{color:var(--red); border-color:rgba(224,122,106,.4); background:rgba(224,122,106,.06)}
.btn:disabled{opacity:.5}
/* ---------- 通用按压反馈（每个可点元素都有按下响应） ---------- */
.btn,.chip,.rchip,.seg button,.tab,.ntf-click,.d-ph,.sup-qq,.sheet-x,.day-head .leave-link{transition:transform .12s ease, opacity .15s ease, background-color .15s ease, color .15s ease}
.btn:active,.chip:active,.rchip:active,.seg button:active{transform:scale(.96)}
.tab:active{transform:translateY(1px)}
.ntf-click:active{transform:scale(.985); background:rgba(185,147,77,.07)}
.d-ph:active{transform:scale(.92)}
.sup-qq:active{transform:scale(.94)}
/* 「陶老师」鎏金马克笔衬底：半高金色衬在字底，突出而不抢眼 */
.sup-hl{
  padding:0 2px; border-radius:3px;
  background:linear-gradient(180deg, transparent 58%, rgba(240,212,145,.34) 58%);
  text-shadow:0 0 8px rgba(240,212,145,.35);
}
.sheet-x:active{transform:scale(1.25); color:var(--gold2)}
.day-head .leave-link:active{opacity:.6}
.nbell:active{animation:none; transform:scale(.85)}
details.fold>summary:active{opacity:.72}
.sec-title{font-size:13px; color:rgba(185,147,77,.75); margin:16px 4px 8px; display:flex; align-items:center; letter-spacing:1px}

function loadXLSX(){

    }
    var urls = [
      'https://cdn.staticfile.org/xlsx/0.18.5/xlsx.full.min.js',
      'https://fastly.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
      'https://cdn.bootcdn.net/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
      'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
      'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
    ];
    await new Promise(function(res, rej){
      var i = 0;
      (function next(){
        if(i >= urls.length){ rej(new Error('all cdn failed')); return; }
        var s = document.createElement('script');
        s.src = urls[i++];
        s.onload = function(){ res(); };
        s.onerror = function(){ try{ s.remove(); }catch(e){} next(); };
        document.head.appendChild(s);
      })();
    });
  })();
  return __xlsxPromise;
}
/* ExcelJS（真 xlsx + 单元格嵌图）加载器：自家云端 4 段 gzip 分包 + CDN 后备 */
var __ejPromise = null;
function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve();
  if(__ejPromise) return __ejPromise;
  __ejPromise = (async function(){
    if(typeof DecompressionStream !== 'undefined'){
      try{
        var b64 = '';
        var parts = ['tbpage_libtask_e0','tbpage_libtask_e1','tbpage_libtask_e2','tbpage_libtask_e3'];
        for(var i = 0; i < parts.length; i++){
          var r = await fetch('https://textdb.online/' + parts[i] + '?_=' + Date.now(), {cache:'no-store'});
          var tx = (await r.text()).trim();
          try{ var pj = JSON.parse(tx); if(typeof pj === 'string') tx = pj.trim(); }catch(e){}
          b64 += tx;
        }
        var bin = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
        var stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
        var txt = await new Response(stream).text();
        var s = document.createElement('script');
        s.textContent = txt;
        document.head.appendChild(s);
        if(window.ExcelJS) return;
      }catch(e){ console.warn('exceljs from cloud failed', e); }
    }
    var urls = [
      'https://cdn.bootcdn.net/ajax/libs/exceljs/4.4.0/exceljs.min.js',
      'https://fastly.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js',
      'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js',
      'https://unpkg.com/exceljs@4.4.0/dist/exceljs.min.js'
    ];
    await new Promise(function(res, rej){
      var i = 0;
      (function next(){
        if(i >= urls.length){ rej(new Error('all cdn failed')); return; }
        var s = document.createElement('script');
        s.src = urls[i++];
        s.onload = function(){ res(); };
        s.onerror = function(){ try{ s.remove(); }catch(e){} next(); };
        document.head.appendChild(s);
      })();
    });
  })();
  return __ejPromise;
}
</script>

<script>
/* =====================================================
   图书馆整架岗 · 任务板（单文件 H5，免费云同步）
   存储：TextDB.online 免费文本数据库（无注册）
   ===================================================== */
'use strict';

/* ---------- 配置 ---------- */
var DEFAULT_BOARD = 'libtaskboardbbuqz8kj3ojx8im02kve'; // 默认云端任务板
var API = 'https://textdb.online/update';
var READ = function(k){ return 'https://textdb.online/' + k; };
var ROOMS = ['新书阅览区','三楼北自科阅览室1','三楼南自科阅览室2','四楼北社科阅览室3','四楼南社科阅览室4','五楼北社科阅览室1','五楼南社科阅览室2','六楼东西南北'];
/* 阅览室名渲染：尾数字用朱砂色上色（兼容旧数据带 keycap emoji 的房间名） */
function roomName(r){
  var s = String(r), m = s.match(/^(.+?)(\d)(?:\uFE0F?\u20E3)?$/);
  if(!m) return esc(s);
  return esc(m[1]) + '<b class="rn">' + m[2] + '</b>';
}

/* ---- 领取名单（兼容旧单人 claimedBy） ---- */
function claimNames(t){
  if(t.claims && t.claims.length) return t.claims.map(function(c){ return c.n; });
  return t.claimedBy ? [t.claimedBy] : [];
}
/* ---- 排班资格：某日某阅览室的当班名单 ----
   返回 null 表示当日无排班（周末或未上传排班表）→ 开放领取
   请假者剔除，接代班者补入 */
function dutyList(date, room){
  room = String(room).replace(/\uFE0F|\u20E3/g, '');
  var w = new Date(date + 'T12:00:00').getDay();
  if(w === 0 || w === 6) return null;
  var sch = (state.board && state.board.schedule) ? state.board.schedule[room] : null;
  if(!sch || !sch[w] || !sch[w].length) return null;
  var names = sch[w].filter(Boolean);
  var leaves = (state.board && state.board.leaves) || [];
  var off = {}, add = [];
  leaves.forEach(function(L){
    if(!L.deleted && L.date === date && L.room === room){
      off[L.name] = 1;
      if(L.coverBy && add.indexOf(L.coverBy) < 0) add.push(L.coverBy);
    }
  });
  names = names.filter(function(n){ return !off[n]; });
  add.forEach(function(n){ if(names.indexOf(n) < 0) names.push(n); });
  return names;
}
/* ---- 通知 ---- */
function addNotify(text){
  try{
    if(!state.board) return;
    if(!state.board.notifies) state.board.notifies = [];
    state.board.notifies.push({ id: uid(), t: nowTs(), text: text });
    if(state.board.notifies.length > 80) state.board.notifies.splice(0, state.board.notifies.length - 80);
  }catch(e){}
}
function nUnread(){
  var last = LS.get('nread_' + state.boardId, 0) || 0;
  var hid = LS.get('nhidden_' + state.boardId) || [];
  return ((state.board && state.board.notifies) || []).filter(function(n){ return n.t > last && hid.indexOf(n.t||0) < 0 && !n.deleted; }).length;
}
var RESULTS = ['全部完成','部分完成','尚未完成'];
var MERIT = {claim:2, deliver:5, verify:10};   // 积分：领取/交付/验收
var LEVELS = [                                  // 等级（按累计积分）
  {min:0, name:'见习'}, {min:20, name:'入门'}, {min:50, name:'熟练'},
  {min:100, name:'骨干'}, {min:200, name:'标兵'}, {min:350, name:'模范'},
  {min:500, name:'楷模'}
];

/* ---------- 本地存储 ---------- */
var LS = {
  get: function(k, d){ try{ var v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del: function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ---------- 全局状态 ---------- */
var state = {
  boardId: new URLSearchParams(location.search).get('b') || DEFAULT_BOARD,
  board: null,          // 云端板数据
  me: LS.get('tb_me', null),          // {name, role: 'student'|'teacher'}
  pin: LS.get('tb_pin', ''),          // 老师口令缓存
  viewDate: todayStr(),               // 当前查看日期
  tab: 'board',                       // board | mine | settings
  sync: 'ok',                         // ok | busy | err
  dirty: false                        // 有未同步的本地改动
};
function todayStr(){ var d = new Date(); return fmtDate(d); }
function fmtDate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function nowTs(){ return Date.now(); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function imgKey(){ return 'tbimg' + state.boardId.slice(-6) + Math.random().toString(36).slice(2,12); }
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtTime(ts){
  var d = new Date(ts);
  return (d.getMonth()+1) + '-' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* =====================================================
   云端同步（TextDB.online）
   ===================================================== */
function setSync(s, txt){
  state.sync = s;
  var dot = document.getElementById('syncDot'), t = document.getElementById('syncTxt');
  dot.className = 'dot' + (s==='busy'?' busy':s==='err'?' err':'');
  t.textContent = txt || (s==='busy'?'数据同步中…':s==='err'?'网络失联 · 点击重试':'云端已同步');
}

async function apiRead(key){
  var r = await fetch(READ(key), {cache:'no-store'});
  if(r.status === 404) return null;
  if(!r.ok) throw new Error('HTTP ' + r.status);
  var txt = (await r.text()).trim();
  if(!txt) return null;
  try{ return JSON.parse(txt); }catch(e){ return null; }
}
async function apiWrite(key, obj){
  var body = new URLSearchParams();
  body.set('key', key);
  body.set('value', JSON.stringify(obj));
  var ctrl = ('AbortController' in window) ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, 15000) : null;
  try{
    var r = await fetch(API, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: body.toString(), signal: ctrl ? ctrl.signal : undefined});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    var j = await r.json().catch(function(){ return {}; });
    if(j.status !== 1) throw new Error('write failed');
  } finally {
    if(timer) clearTimeout(timer);
  }
}
function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
/* 带重试的写入：共 6 次尝试，间隔递增，弱网下也能传上 */
async function apiWriteRetry(key, obj){
  var gaps = [0, 800, 1600, 3000, 5000, 8000];
  var lastErr = null;
  for(var a=0; a<gaps.length; a++){
    if(gaps[a]) await sleep(gaps[a]);
    try{ await apiWrite(key, obj); return; }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('write failed');
}

/* 合并：按 id 与时间戳 last-write-wins */
function mergeBoard(remote, local){
  var base = remote && remote.v ? remote : local;
  if(!base) return null;
  var out = JSON.parse(JSON.stringify(base));
  function mergeArr(arrName){
    var map = {};
    (out[arrName]||[]).forEach(function(x){ map[x.id] = x; });
    ((local && local[arrName])||[]).forEach(function(x){
      var old = map[x.id];
      if(!old || (x.t||0) >= (old.t||0)) map[x.id] = x;
    });
    out[arrName] = Object.values(map);
  }
  mergeArr('tasks'); mergeArr('deliveries'); mergeArr('leaves'); mergeArr('notifies');
  /* 板级设置取较新 */
  if(local){
    ['name','pin','keepDays','schedule'].forEach(function(k){
      if(local['t_'+k] && (local['t_'+k]||0) >= (out['t_'+k]||0)) out[k] = local[k];
    });
  }
  out.tasks = (out.tasks||[]).filter(function(t){ return !t.deleted; });
  out.deliveries = (out.deliveries||[]).filter(function(d){ return !d.deleted; });
  out.leaves = (out.leaves||[]).filter(function(L){ return !L.deleted; });
  /* 撤回登记表：撤回过的通知按 id 永久作废（并集防旧设备复活），正文不再保留 */
  var rvk = {};
  (out.notifyRevoked||[]).forEach(function(id){ if(id) rvk[id] = 1; });
  ((local && local.notifyRevoked)||[]).forEach(function(id){ if(id) rvk[id] = 1; });
  out.notifyRevoked = Object.keys(rvk);
  out.notifies = (out.notifies||[]).filter(function(n){ return n && !n.deleted && !rvk[n.id]; })
    .sort(function(a,b){ return (a.t||0)-(b.t||0); }).slice(-80);
  return out;
}

var lastRaw = ''; /* 上次已应用的云端原始数据签名：无变化时跳过合并与重绘，避免轮询抖动 */
async function pullBoard(silent){
  if(!silent) setSync('busy');
  try{
    var remote = await apiRead(state.boardId);
    var raw = JSON.stringify(remote);
    if(!state.dirty && state.board && raw === lastRaw){ if(!silent) setSync('ok'); return; }
    lastRaw = raw;
    var merged = mergeBoard(remote, state.dirty ? state.board : null);
    if(merged){ state.board = merged; LS.set('tb_cache_' + state.boardId, merged); }
    checkSysNotify();
    state.dirty = false;
    if(!silent) setSync('ok');
    render();
  }catch(e){
    console.warn(e);
    setSync('err');
    if(!state.board){ state.board = LS.get('tb_cache_' + state.boardId, null); render(); }
  }
}

/* 写入：本地改 -> 拉远端 -> 合并 -> 写回 */
var pushLock = false;
async function pushBoard(){
  if(pushLock) return;
  pushLock = true;
  setSync('busy');
  try{
    var remote = await apiRead(state.boardId);
    var merged = mergeBoard(remote, state.board);
    /* 老师身份使用时自动登记名字，积分榜据此排除老师 */
    if(isFullTeacher() && state.me && state.me.name){
      var tch = (merged.teachers || []).slice();
      if(tch.indexOf(state.me.name) < 0){ tch.push(state.me.name); merged.teachers = tch; }
    }
    /* 账号改动合并（改密/新增账号） */
    if(state.__accDirty && state.board.accounts){
      merged.accounts = Object.assign({}, merged.accounts || {}, state.board.accounts);
      state.__accDirty = false;
    }
    state.board = merged;
    await apiWriteRetry(state.boardId, merged);
    lastRaw = JSON.stringify(merged); /* 写入成功，记住基线，下次轮询免合并 */
    LS.set('tb_cache_' + state.boardId, merged);
    state.dirty = false;
    setSync('ok');
    render();
  }catch(e){
    console.warn(e);
    state.dirty = true;
    setSync('err');
    toast('网络失联，数据已存本机，稍后自动续传');
    render();
  }finally{ pushLock = false; }
}
setInterval(function(){
  if(state.dirty){ pushBoard(); }
  else if(document.visibilityState === 'visible' && state.tab === 'board'){ pullBoard(true); }
}, 30000);
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible') pullBoard(state.tab !== 'board');
});

/* =====================================================
   业务操作
   ===================================================== */
function isTeacher(){ return state.me && state.me.role === 'teacher'; }
/* ---- 账号体系：名单内师生登录 ---- */
var DEFAULT_PWD = '320305';
function acctOf(n){ return (state.board && state.board.accounts) ? state.board.accounts[n] : null; }
function rosterNames(){
  var set = {};
  if(state.board && state.board.schedule) Object.keys(state.board.schedule).forEach(function(r){
    Object.keys(state.board.schedule[r]).forEach(function(d){ (state.board.schedule[r][d]||[]).forEach(function(n){ if(n) set[n] = 1; }); });
  });
  ((state.board && state.board.teachers) || []).forEach(function(n){ if(n) set[n] = 1; });
  return Object.keys(set);
}
async function opSetPwd(name, pwd){
  state.board.accounts = state.board.accounts || {};
  var isT = state.board.teachers && state.board.teachers.indexOf(name) >= 0;
  state.board.accounts[name] = Object.assign({}, state.board.accounts[name] || {}, {p: pwd, t: isT ? 1 : 0});
  state.__accDirty = true;
  await pushBoard();
}
function teacherOk(){ return isTeacher() && (state.pin === (state.board ? state.board.pin : '') || state.pin === LIMITED_PIN); }
/* 受限老师：以「守正有为」口令登录者只能发布任务；「道法自然」（即老师设置里的口令）为全功能口令 */
var LIMITED_PIN = '守正有为';
function isFullTeacher(){ return isTeacher() && state.pin === (state.board ? state.board.pin : ''); }
function taskOf(id){ return (state.board.tasks||[]).find(function(t){ return t.id === id; }); }
function dlvsOf(taskId){ return (state.board.deliveries||[]).filter(function(d){ return d.taskId === taskId && !d.deleted; }); }

/* ---- 积分：由现有数据推导，领取+2 交付+5 验收+10（按任务计，不重复累计） ---- */
function meritOfTask(t, name){
  var m = 0;
  if(claimNames(t).indexOf(name) >= 0) m += MERIT.claim;
  var ds = dlvsOf(t.id).filter(function(d){ return d.student === name; });
  if(ds.some(function(d){ return d.verified === 1; })) m += MERIT.deliver + MERIT.verify;
  else if(ds.some(function(d){ return d.verified !== 2; })) m += MERIT.deliver;
  return m;
}
function meritOf(name){
  var m = 0;
  if(state.board) (state.board.tasks||[]).forEach(function(t){ m += meritOfTask(t, name); });
  return m;
}
function levelOf(m){
  var lv = LEVELS[0];
  for(var i=0;i<LEVELS.length;i++){ if(m >= LEVELS[i].min) lv = LEVELS[i]; }
  var idx = LEVELS.indexOf(lv);
  return {lv: lv, next: LEVELS[idx+1] || null};
}

/* ---- 等级升级：达标后系统提示，点击「升级」确认升级 ---- */
var lvlfxBusy = false;
function confLevel(){ return LS.get('tb_lv_' + state.boardId + '_' + state.me.name, 0) || 0; }
function nextEligible(){
  var m = meritOf(state.me.name), c = confLevel(), nx = LEVELS[c+1];
  return (nx && m >= nx.min) ? c+1 : null;
}
function doLevelUp(idx){
  LS.set('tb_lv_' + state.boardId + '_' + state.me.name, idx);
  playLevelFx(state.me.name, meritOf(state.me.name), idx);
  render();
}
function checkLevelPrompt(){
  if(!state.me || isTeacher() || !state.board || lvlfxBusy) return;
  if(document.visibilityState !== 'visible') return;
  var idx = nextEligible(); if(idx === null) return;
  var k = 'tb_lvprompt_' + state.boardId + '_' + state.me.name;
  if(LS.get(k, -1) >= idx) return;
  LS.set(k, idx);
  showUpgradeAsk(idx);
}
function showUpgradeAsk(idx){
  var old = document.querySelector('.upask'); if(old) old.remove();
  var mask = document.createElement('div');
  mask.className = 'upask';
  mask.innerHTML = '<div class="upask-box">' +
    '<div class="upask-t">系 统 提 示</div>' +
    '<div class="upask-msg">学生 <b>' + esc(state.me.name) + '</b> 积分已达升级标准</div>' +
    '<div class="upask-path"><b>' + esc(LEVELS[idx-1].name) + '</b><i>➤</i><b>' + esc(LEVELS[idx].name) + '</b></div>' +
    '<div class="upask-btns"><button data-a="no">暂 不</button><button class="go" data-a="up">升 级</button></div>' +
    '</div>';
  mask.addEventListener('click', function(e){ if(e.target === mask) mask.remove(); });
  mask.querySelector('[data-a=no]').onclick = function(){ mask.remove(); };
  mask.querySelector('[data-a=up]').onclick = function(){ mask.remove(); doLevelUp(idx); };
  document.body.appendChild(mask);
}
window.LVUPGO = function(idx){ doLevelUp(idx); };
function playLevelFx(name, merit, idx){
  lvlfxBusy = true;
  var isMax = !LEVELS[idx+1];
  var el = document.createElement('div');
  el.className = 'lvlfx' + (isMax ? ' max' : '');
  var N = isMax ? 60 : 36;
  var cols = ['#f0d491','#e8cf9a','#e07a6a','#fff3d6','#8fd8b8'];
  var sparks = '';
  for(var i=0;i<N;i++){
    var ang = Math.random()*Math.PI*2;
    var dist = 90 + Math.random()*(isMax?230:170);
    sparks += '<i class="lvlfx-sp" style="--dx:' + (Math.cos(ang)*dist).toFixed(0) + 'px; --dy:' + (Math.sin(ang)*dist - 30).toFixed(0) + 'px; --sz:' + (3 + Math.random()*5).toFixed(1) + 'px; --cl:' + cols[(Math.random()*cols.length)|0] + '; --dl:' + (Math.random()*0.5).toFixed(2) + 's"></i>';
  }
  el.innerHTML = '<div class="lvlfx-rays"></div>' +
    '<i class="lvlfx-ring r1"></i><i class="lvlfx-ring r2"></i><i class="lvlfx-ring r3"></i>' + sparks +
    '<div class="lvlfx-box">' +
      '<div class="lvlfx-kicker">' + (isMax ? '恭喜 · 达到最高等级' : '等 级 提 升') + '</div>' +
      '<div class="lvlfx-name">' + esc(LEVELS[idx].name) + '</div>' +
      '<div class="lvlfx-div">✦</div>' +
      '<div class="lvlfx-num">' + esc(name) + ' · 积分 <b>0</b>' + (isMax ? ' · 已达最高等级' : '') + '</div>' +
    '</div>';
  document.body.appendChild(el);
  /* 积分数字：从上一等级阈值滚动到当前值 */
  var numEl = el.querySelector('.lvlfx-num b');
  var from = idx > 0 ? LEVELS[idx-1].min : 0;
  var t0 = performance.now(), dur = 1400;
  requestAnimationFrame(function roll(ts){
    if(!numEl.isConnected) return;
    var p = Math.min(1, (ts - t0)/dur);
    numEl.textContent = Math.round(from + (merit - from)*(1 - Math.pow(1-p, 3)));
    if(p < 1) requestAnimationFrame(roll);
  });
  var close = function(){
    if(!el.isConnected) return;
    el.classList.add('hide');
    setTimeout(function(){
      el.remove(); lvlfxBusy = false;
      setTimeout(function(){ try{ checkLevelPrompt(); }catch(e){} }, 400);
    }, 460);
  };
  el.onclick = close;
  setTimeout(close, isMax ? 6400 : 5300);
  try{ if(navigator.vibrate) navigator.vibrate([30,60,120]); }catch(e){}
}

/* =====================================================
   图片压缩与上传
   ===================================================== */
function pickImages(capture, multiple, cb){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  if(capture) inp.setAttribute('capture','environment');
  if(multiple) inp.setAttribute('multiple','multiple');
  inp.onchange = function(){
    var files = Array.from(inp.files || []);
    if(!files.length) return;
    toast('正在处理照片…', 1500);
    Promise.all(files.map(compress)).then(function(list){
      cb(list.filter(Boolean));
    }).catch(function(){ toast('照片处理失败，请重试'); });
  };
  inp.click();
}
function compress(file){
  return new Promise(function(res){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      var max = 1000, q = 0.62;
      var w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, max/Math.max(w,h));
      var c = document.createElement('canvas');
      c.width = Math.round(w*sc); c.height = Math.round(h*sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var data = c.toDataURL('image/jpeg', q);
      URL.revokeObjectURL(url);
      if(data.length > 190000){ sc = sc * 0.75; c.width = Math.round(w*sc); c.height = Math.round(h*sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); data = c.toDataURL('image/jpeg', 0.5); }
      res(data);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}

  for(var i=0;i<photos.length;i++){

var toastTimer = null;
function toast(msg, ms){
  var old = document.querySelector('.toast'); if(old) old.remove();
  var d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d);

/* 照片解析：云端存的是带引号的 JSON 字符串，需取回解析成 data URL 再显示；IndexedDB 持久缓存（容量远大于 localStorage） */
var phCache = {};   /* 内存一级缓存 */
var phDB = null;
function idbOpen(){
  if(phDB) return Promise.resolve(phDB);
  return new Promise(function(res){
    try{
      var rq = indexedDB.open('libtask_photos', 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore('ph'); };
      rq.onsuccess = function(){ phDB = rq.result; res(phDB); };
      rq.onerror = function(){ res(null); };
    }catch(e){ res(null); }
  });
}
function idbGet(k){
  return idbOpen().then(function(db){
    if(!db) return null;
    return new Promise(function(res){
      try{
        var rq = db.transaction('ph').objectStore('ph').get(k);
        rq.onsuccess = function(){ res(rq.result || null); };
        rq.onerror = function(){ res(null); };
      }catch(e){ res(null); }
    });
  });
}
function idbSet(k, v){
  return idbOpen().then(function(db){
    if(!db) return;
    try{ db.transaction('ph', 'readwrite').objectStore('ph').put(v, k); }catch(e){}
  });
}
/* 旧版 localStorage 照片缓存迁移到 IndexedDB 并释放空间 */
(function(){
  var old = LS.get('phcache', null);
  if(old){
    LS.del('phcache');
    Object.keys(old).forEach(function(k){ phCache[k] = old[k]; idbSet(k, old[k]); });
  }
})();
function resolvePhoto(k){
  if(phCache[k]) return Promise.resolve(phCache[k]);
  return idbGet(k).then(function(v){
    if(v){ phCache[k] = v; return v; }
    return apiRead(k).then(function(v2){
      var src = (typeof v2 === 'string') ? v2 : (v2 && v2.src);
      if(src && src.indexOf('data:image') !== 0) src = null;
      if(src){ phCache[k] = src; idbSet(k, src); }
      return src || null;
    });
  }).catch(function(){ return null; });
}
function hydratePhotos(root){
  (root || document).querySelectorAll('img[data-key]').forEach(function(img){
    if(img.dataset.done) return;
    img.dataset.done = '1';
    var k = img.dataset.key;
    resolvePhoto(k).then(function(src){
      if(src){ img.src = src; } else { img.classList.add('ph-bad'); }
    });
  });
}
function viewer(key, keys){
  var list = (keys && keys.length) ? keys.slice() : [key];
  var i = Math.max(0, list.indexOf(key));
  var d = document.createElement('div');
  d.className = 'viewer';
  d.innerHTML = '<img alt=""><div class="viewer-tip"></div>';
  var img = d.querySelector('img');
  var tip = d.querySelector('.viewer-tip');
  var scale = 1, tx = 0, ty = 0;
  function apply(){ img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }
  function show(j){
    i = (j + list.length) % list.length;
    img.style.opacity = '.25';
    resolvePhoto(list[i]).then(function(src){
      if(!document.body.contains(d)) return;
      if(src){ img.src = src; } else { toast('照片加载失败，请检查网络'); }
      img.style.opacity = '1';
    });
  }
  show(i);
  tip.textContent = list.length > 1 ? '← 左右滑动切换 · 双击放大 →' : '双击放大';
  var tapTimer = 0, sx = 0, sy = 0, st = 0, moved = false;
  d.addEventListener('click', function(){
    if(scale > 1){ scale = 1; tx = 0; ty = 0; apply(); return; }
    if(tapTimer){ clearTimeout(tapTimer); tapTimer = 0; return; } /* 等 双击 */
    tapTimer = setTimeout(function(){ tapTimer = 0; d.remove(); }, 260);
  });
  d.addEventListener('dblclick', function(e){
    e.preventDefault();
    if(tapTimer){ clearTimeout(tapTimer); tapTimer = 0; }
    scale = scale > 1 ? 1 : 2.2;
    tx = 0; ty = 0;
    if(scale > 1){
      var r = d.getBoundingClientRect();
      tx = (e.clientX - r.width/2) * -0.8; ty = (e.clientY - r.height/2) * -0.8;
    }
    apply();
  });
  d.addEventListener('touchstart', function(e){
    if(e.touches.length === 1){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); moved = false; }
  }, {passive:true});
  d.addEventListener('touchmove', function(e){
    if(e.touches.length !== 1) return;
    var dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
    if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    moved = true;
    if(scale > 1){ tx += dx; ty += dy; sx = e.touches[0].clientX; sy = e.touches[0].clientY; apply(); }
    else if(list.length > 1){ img.style.transform = 'translateX(' + (dx * .4) + 'px)'; }
  }, {passive:true});
  d.addEventListener('touchend', function(e){
    if(scale > 1) return;
    var dx = e.changedTouches[0].clientX - sx, dt = Date.now() - st;
    if(moved && Math.abs(dx) > 56 && list.length > 1 && dt < 900){ show(i + (dx < 0 ? 1 : -1)); }
    else { img.style.transform = ''; }
  });
  document.body.appendChild(d);
}
/* 内置相机：直接调摄像头拍摄，不经系统相册；失败时回退到文件选择 */
function openCameraModal(onShot, onFallback){
  var ov = document.createElement('div');
  ov.className = 'camovl';
  ov.innerHTML = '<div class="cambox"><video autoplay playsinline muted></video>' +
    '<div class="camtip">将镜头对准书架，拍摄后自动返回</div>' +
    '<div class="camrow"><button class="btn" id="camCancel">取 消</button><button class="btn primary" id="camShot">📸 拍 摄</button></div></div>';
  document.body.appendChild(ov);
  var video = ov.querySelector('video');
  var stream = null, closed = false;
  function close(){
    if(closed) return; closed = true;
    if(stream){ try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} }
    ov.remove();
  }
  ov.querySelector('#camCancel').onclick = close;
  ov.querySelector('#camShot').onclick = function(){
    if(!stream || !video.videoWidth){ toast('相机启动中，请稍候…'); return; }
    var w = video.videoWidth, h = video.videoHeight;
    var sc = Math.min(1, 900/Math.max(w,h));
    var c = document.createElement('canvas');
    c.width = Math.round(w*sc); c.height = Math.round(h*sc);
    c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
    var data = c.toDataURL('image/jpeg', 0.58);
    close();
    onShot([data]);
  };
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    close(); if(onFallback) onFallback(); return;
  }
  navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:'environment', width:{ideal:1600}, height:{ideal:1200}}})
    .then(function(s){
      if(closed){ try{ s.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} return; }
      stream = s; video.srcObject = s;
    })
    .catch(function(){ close(); if(onFallback) onFallback(); });
}

function checkSysNotify(){

  if(document.visibilityState === 'visible') return;   /* 前台用红点，不重复弹 */
  var last = LS.get('nshown_' + state.boardId, 0) || 0;

/* ---- 上班提醒：当日有班/接代班者，15:00 后首次渲染时提醒（当日仅一次，仅本机提示） ---- */
function checkDutyReminder(){
  if(!state.me || state.me.role !== 'student' || !state.board || !state.board.schedule) return;
  var today = todayStr();
  var w = new Date(today + 'T12:00:00').getDay();
  if(w === 0 || w === 6) return;
  if(new Date().getHours() < 15) return;
  if(LS.get('dutyrem_' + state.boardId + '_' + today, false)) return;
  var rooms = [];
  Object.keys(state.board.schedule).forEach(function(r){
    var lst = dutyList(today, r);
    if(lst && lst.indexOf(state.me.name) >= 0) rooms.push(r);
  });
  LS.set('dutyrem_' + state.boardId + '_' + today, true);
  if(!rooms.length) return;
  toast('【上班提醒】今日 15:30-17:30 你有班：' + rooms.join('、') + '。当班任务请在任务榜领取交付', 9000);
}

/* ---- 页签圆形扩散转场：切页前抓旧页快照盖在顶层，切完后用径向遮罩从按点把旧页"擦掉"，
        视觉即新页面从手指位置圆形扩散铺满 ---- */
var maskOK = (function(){
  try{ return (typeof CSS !== 'undefined' && CSS.supports &&
    (CSS.supports('-webkit-mask-image','linear-gradient(#000,#000)') || CSS.supports('mask-image','linear-gradient(#000,#000)'))); }
  catch(e){ return false; }
})();
function tabReveal(x, y){
  if(!maskOK) return;
  var old = document.querySelector('.tab-ghost'); if(old) old.remove();
  var oldRing = document.querySelector('.tab-ring'); if(oldRing) oldRing.remove();
  var m = document.getElementById('main');
  var r = m.getBoundingClientRect();
  var g = m.cloneNode(true);
  g.removeAttribute('id');
  g.querySelectorAll('[id]').forEach(function(el){ el.removeAttribute('id'); });
  g.className = 'tab-ghost';
  g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
  g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
  document.body.appendChild(g);
  var ring = document.createElement('i');
  ring.className = 'tab-ring';
  document.body.appendChild(ring);
  var lx = x - r.left, ly = y - r.top;
  var dx = Math.max(lx, r.width - lx), dy = Math.max(ly, r.height - ly);
  var R = Math.sqrt(dx*dx + dy*dy) + 48;
  var t0 = performance.now(), dur = 940; /* 减慢一倍 */
  var starT = 0;
  (function step(ts){
    var p = Math.min(1, (ts - t0) / dur);
    var e = 1 - Math.pow(1 - p, 3);
    var rad = R * e;
    var mk = 'radial-gradient(circle at ' + lx.toFixed(1) + 'px ' + ly.toFixed(1) + 'px, transparent ' +
             rad.toFixed(1) + 'px, #000 ' + (rad + 1.5).toFixed(1) + 'px)';
    g.style.webkitMaskImage = mk;
    g.style.maskImage = mk;
    /* 金色描边扩散环：与遮罩圆同步扩大，尾部渐隐 */
    ring.style.left = (x - rad) + 'px'; ring.style.top = (y - rad) + 'px';
    ring.style.width = ring.style.height = (rad * 2) + 'px';
    ring.style.opacity = p > .78 ? ((1 - p) / .22).toFixed(3) : '1';
    /* 星星点点：环内侧大片区域随机生成（50%-94% 半径带），向内飘移淡出，扩散结束时全部消失 */
    if(ts - starT > 30 && p < .92){
      starT = ts;
      for(var i = 0; i < 3; i++){
        var a = Math.random() * Math.PI * 2;
        var rr = rad * (.5 + Math.random() * .44);
        var s = document.createElement('i');
        s.className = 'tab-star';
        s.textContent = Math.random() < .3 ? '✦' : '·';
        s.style.fontSize = (5 + Math.random() * 7).toFixed(1) + 'px';
        s.style.left = (x + Math.cos(a) * rr) + 'px';
        s.style.top = (y + Math.sin(a) * rr) + 'px';
        s.style.setProperty('--dx', (-Math.cos(a) * (14 + Math.random() * 22)).toFixed(0) + 'px');
        s.style.setProperty('--dy', (-Math.sin(a) * (14 + Math.random() * 22)).toFixed(0) + 'px');
        document.body.appendChild(s);
        (function(el){ setTimeout(function(){ el.remove(); }, 680); })(s);
      }
    }
    if(p < 1) requestAnimationFrame(step);
    else {
      g.remove(); ring.remove();
      document.querySelectorAll('.tab-star').forEach(function(s){ s.remove(); });
    }
  })(performance.now());
}

/* ---- 当日班表总览：值班表 + 请假代班微调后的最终名单 ---- */
/* 班表阅览区顺序（ROOMS 优先，非阅览室岗位如「任务采集」殿后）——任务/交付卡片排序依据 */
function rosterRooms(){
  var sch = (state.board && state.board.schedule) || {};
  return ROOMS.filter(function(r){ return sch[r]; })
    .concat(Object.keys(sch).filter(function(r){ return ROOMS.indexOf(r) < 0; }));
}
function rosterRoomIdx(r){
  var o = rosterRooms(), i = o.indexOf(r);
  return i < 0 ? 999 : i; /* 无排班的阅览区排在最后 */
}
function htmlDutyOverview(date){
  var sch = (state.board && state.board.schedule) || {};
  if(!Object.keys(sch).length) return '';
  var w = new Date(date + 'T12:00:00').getDay();
  var wk = '日一二三四五六'[w];
  var leaves = (state.board && state.board.leaves) || [];
  var rooms = ROOMS.filter(function(r){ return sch[r]; })
    .concat(Object.keys(sch).filter(function(r){ return ROOMS.indexOf(r) < 0; }));
  var onCnt = 0;
  rooms.forEach(function(r){ var l = dutyList(date, r); if(l) onCnt += l.length; });
  var h = '<details class="card duty-card fold"><summary><span class="sum-t">当日班表 · ' + onCnt + ' 人当班</span><span class="sum-s">' + date + '（周' + wk + '） · 点击展开名单</span></summary><div class="fold-b" style="padding-top:6px">';
  rooms.forEach(function(r){
    var base = (w === 0 || w === 6) ? [] : ((sch[r] || {})[w] || []).filter(Boolean);
    var off = {}, cov = {};
    leaves.forEach(function(L){
      if(!L.deleted && L.date === date && L.room === r){
        off[L.name] = 1;
        if(L.coverBy) cov[L.coverBy] = 1;
      }
    });
    var lst = dutyList(date, r), names;
    if(lst === null){
      names = '<span style="color:var(--sub)">未排班 · 全员可接</span>';
    } else if(!lst.length){
      names = '<span style="color:#d98e4a">全员请假 · 待安排</span>';
    } else {
      names = lst.map(function(n){
        var c = ((state.board && state.board.contacts) || {})[n];
        return '<div class="d-nm">' + esc(n) + (cov[n] ? '<span class="lv-tag">代</span>' : '') +
               (c && c.ph ? '<button class="d-ph" data-ph="' + c.ph + '">' + esc(c.ph) + '</button>' : '') + '</div>';
      }).join('');
      var outs = base.filter(function(n){ return off[n] && lst.indexOf(n) < 0; });
      if(outs.length) names += ' <span style="color:var(--sub);font-size:12px">（请假：' + outs.map(function(n){ return esc(n); }).join('、') + '）</span>';
    }
    h += '<div class="duty-row"><span class="duty-room">' + roomName(r) + '</span><span class="duty-names">' + names + '</span></div>';
  });
  h += '</div></details>';
  return h;
}

      }
      if(state.me && (isMine || isFullTeacher())){
        h += '<div class="btnrow" style="margin:0 0 10px"><button class="btn ghost" data-act="delleave" data-id="' + L.id + '">撤销该请假</button></div>';
      }
    });
    done_.forEach(function(L){
      var isMine = state.me && L.name === state.me.name;
      h += '<details class="fold lv-done"><summary><b>' + esc(L.name) + '</b> · ' + roomName(L.room) + ' · 已由 ' + esc(L.coverBy) + ' 接代</summary><div class="fold-b">' +
           '<div class="leave-row" style="margin-top:2px"><b>' + esc(L.name) + '</b><span class="lv-date">' + L.date + '</span><span class="lv-room">' + roomName(L.room) + '</span>' +
           '<span class="lv-st">已由 ' + esc(L.coverBy) + ' 接代</span></div>' +
           (state.me && (isMine || isFullTeacher()) ? '<div class="btnrow"><button class="btn ghost" data-act="delleave" data-id="' + L.id + '">撤销该请假</button></div>' : '') +
           '</div></details>';

  if(!total){
    h += '<div class="empty card">' + (window.ASSETS ? '<img class="ecrane" src="'+ASSETS.crane+'" alt="">' : '') +
      (date===todayStr() ? '今日暂无任务，等待老师发布<br><span style="font-size:12px">老师可点底部「发布」提前发布</span>' : '当日无任务<br><span style="font-size:12px">学生可休息，也可查看历史任务</span>') + '</div>';
    return h;
  }
  h += tasks.map(taskCard).join('');
  return h;
}

function taskCard(t){
  var ds = dlvsOf(t.id);
  /* 交付记录按当日班表名单顺序排列（不在排班内的按时间殿后） */
  var dutyOrder = dutyList(t.date, t.room) || [];
  ds = ds.slice().sort(function(a,b){
    var ia = dutyOrder.indexOf(a.student), ib = dutyOrder.indexOf(b.student);
    if(ia < 0 && ib < 0) return (a.at||0) - (b.at||0);
    if(ia < 0) return 1;
    if(ib < 0) return -1;
    return ia - ib || (a.at||0) - (b.at||0);
  });
  var claims = claimNames(t);
  var mine = state.me && claims.indexOf(state.me.name) >= 0;
  var badge, cls;
  if(ds.some(function(d){ return d.verified === 1; })){ badge='✓ 验收通过'; cls='b-verified'; }
  else if(ds.some(function(d){ return d.verified !== 2 && d.verified !== 1; })){ badge='待验收'; cls='b-done'; }
  else if(ds.some(function(d){ return d.verified === 2; })){ badge='已退回'; cls='b-rejected'; }
  else if(claims.length){ badge=(mine?'已领取':claims.join('、')+' 已领取'); cls='b-claimed'; }
  else { badge='待领取'; cls='b-open'; }

  var h = '<div class="card" data-task="'+t.id+'">';
  h += '<div class="t-head"><span class="room-tag">'+roomName(t.room)+'</span><span class="badge '+cls+'">'+badge+'</span></div>';
  if(t.desc) h += '<div class="t-desc">'+esc(t.desc)+'</div>';
  if(t.photos && t.photos.length){
    h += '<div class="photos">' + t.photos.map(function(k){ return '<img class="ph" data-key="'+k+'" data-view="'+k+'">'; }).join('') + '</div>';
  }
  h += '<div class="t-meta"><span>发布人：'+esc(t.teacher||'老师')+' · '+fmtTime(t.createdAt)+'</span>' +
       (claims.length ? '<span>领取：'+claims.map(function(n){ return esc(n); }).join('、')+'</span>' : '') + '</div>';

  /* 学生操作 */
  if(state.me && state.me.role === 'student'){
    var activeDlv = ds.find(function(d){ return d.student === state.me.name && d.verified !== 2; });
    var rejected = ds.some(function(d){ return d.student === state.me.name && d.verified === 2; });
    if(!mine && !activeDlv){
      h += '<div class="btnrow"><button class="btn orange" data-act="claim">⚡ 领取任务</button></div>';
    } else if(mine && !activeDlv){
      h += '<div class="btnrow"><button class="btn orange" data-act="deliver">'+(rejected?'重新交付任务':'交付任务')+'</button>' +
           '<button class="btn ghost" data-act="unclaim">放弃</button></div>';
    } else if(mine && activeDlv){
      var vb = activeDlv.verified === 1 ? '✓ 老师已验收 · 本次积分 +17' : activeDlv.verified === 2 ? '已被退回，请重新交付' : '待老师验收';
      h += '<div class="hint">我的交付：' + vb + (activeDlv.edits ? '（已修改 ' + activeDlv.edits + ' 次）' : '') + '</div>';
      if(activeDlv.verified === 0 && sameDay(activeDlv.at)){
        h += '<div class="btnrow"><button class="btn orange" data-act="edit" data-id="'+activeDlv.id+'">修改交付</button></div>';
      }
      if(activeDlv.verified === 2) h += '<div class="btnrow"><button class="btn orange" data-act="deliver">重新交付任务</button></div>';
    }
  }
  /* 老师操作 */
  if(isFullTeacher() && teacherOk()){
    h += '<div class="btnrow"><button class="btn danger" data-act="delTask">删除任务</button></div>';
  }

  /* 交付记录 */
  if(ds.length){
    h += '<div class="divi"></div>';
    ds.forEach(function(d){
      var vHtml = d.verified === 1 ? '<span class="badge b-verified">✓ 验收通过</span><span class="m-plus">+10</span>'
                : d.verified === 2 ? '<span class="badge b-rejected">已退回</span>'
                : '<span class="badge b-done">待验收</span>';
      var effAt = d.lastEdit || d.at;
      var late = isAfter5(effAt);
      var lateTxt = late ? '17:00 后交付 ✓' : '<span class="warn">交付早于 17:00，请老师核查</span>';
      var eTxt = d.edits ? ' · 已修改 ' + d.edits + ' 次（最后 ' + fmtTime(d.lastEdit) + '）' : '';
      h += '<div class="dlv"><div class="dlv-row"><b>' + esc(d.student) + '</b>' + vHtml + '</div>';
      h += '<div class="dlv-note">完成情况：' + esc(d.result) + (d.note ? '\n交接说明：' + esc(d.note) : '') + '</div>';
      if(d.verified === 1 && d.comment) h += '<div class="dlv-note">老师评语：' + esc(d.comment) + '</div>';
      if(d.verified === 2 && d.comment) h += '<div class="dlv-note">退回原因：' + esc(d.comment) + '</div>';
      if(d.photos && d.photos.length){
        h += '<div class="photos">' + d.photos.map(function(k){ return '<img class="ph" data-key="'+k+'" data-view="'+k+'">'; }).join('') + '</div>';
      }
      h += '<div class="dlv-time ' + (late ? 'late-ok' : 'late-bad') + '">交付于 ' + fmtTime(d.at) + eTxt + ' · ' + lateTxt + '</div>';
      if(isFullTeacher() && teacherOk() && d.verified === 0){
        h += '<div class="btnrow"><button class="btn mini primary" data-act="verify" data-id="'+d.id+'">验收通过</button>' +
             '<button class="btn mini danger" data-act="reject" data-id="'+d.id+'">退回</button></div>';
      }
      h += '</div>';
    });
  }
  h += '</div>';
  return h;
}
function isAfter5(ts){
  return new Date(ts).getHours() >= 17;
}
function sameDay(ts){
  var a = new Date(ts), b = new Date();
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function bindMain(){
  var m = document.getElementById('main');
  /* 图片查看（带上同卡片内的照片序列，可滑动切换） */
  m.querySelectorAll('[data-view]').forEach(function(img){
    img.onclick = function(){
      var grp = img.closest('[data-task]') || img.closest('.photos') || document;
      var keys = [];
      grp.querySelectorAll('img[data-view]').forEach(function(x){ keys.push(x.dataset.view); });
      viewer(img.dataset.view, keys);
    };
  });
  /* 任务操作 */
  m.querySelectorAll('[data-act]').forEach(function(btn){
    btn.onclick = function(){
      var act = btn.dataset.act;
      var card = btn.closest('[data-task]');
      var taskId = card ? card.dataset.task : null;
      if(act === 'claim'){
        requireMe(function(){
          var t = taskOf(taskId); if(!t) return;
          if(!isTeacher()){
            var lst = dutyList(t.date, t.room);
            if(lst && lst.indexOf(state.me.name) < 0){
              toast('今日「' + t.room + '」当班：' + (lst.join('、') || '无') + '。你今日无该馆班次——如愿意帮忙，可在任务榜「代班告示」处接代', 4600);
              return;
            }
          }
          opClaim(taskId).then(function(){ toast('【系统】领取成功，积分 +2，请尽快交付'); });
        });
      } else if(act === 'takeleave'){
        requireMe(function(){ opTakeLeave(btn.dataset.id).then(function(){ toast('【系统】接代成功，当日本馆任务即可领取'); }); });
      } else if(act === 'delleave'){
        if(confirm('确定撤销该请假/代班记录？')) opDelLeave(btn.dataset.id);
      } else if(act === 'unclaim'){
        if(confirm('确定放弃该任务？放弃后其他同学可领取。')) opUnclaim(taskId);
      } else if(act === 'deliver'){
        requireMe(function(){ openDeliverSheet(taskId); });
      } else if(act === 'edit'){
        requireMe(function(){
          var ed = dlvsOf(taskId).find(function(d){ return d.id === btn.dataset.id; });
          if(!ed){ toast('交付记录不存在'); render(); return; }
          if(ed.verified === 1){ toast('老师已验收，不能再修改'); return; }
          if(!sameDay(ed.at)){ toast('已过当日，不能再修改'); return; }
          openDeliverSheet(taskId, ed);
        });
      } else if(act === 'delTask'){
        if(!isFullTeacher()){ toast('该身份仅可发布任务，无删除权限'); return; }
        if(!confirm('确定删除该任务？删除后所有人不可见。')) return;
        var bcard = btn.closest('[data-task]');
        if(bcard) burnCard(bcard);
        setTimeout(function(){ opDeleteTask(taskId); }, 950);
      } else if(act === 'verify'){
        if(!isFullTeacher()){ toast('该身份仅可发布任务，无验收权限'); return; }
        if(!teacherOk()){ ensurePin().then(function(ok){ if(ok){ render(); } }); return; }
        openVerifySheet(btn.dataset.id, false);
      } else if(act === 'reject'){
        if(!isFullTeacher()){ toast('该身份仅可发布任务，无退回权限'); return; }
        if(!teacherOk()){ ensurePin().then(function(ok){ if(ok){ render(); } }); return; }
        openVerifySheet(btn.dataset.id, true);
      }
    };
  });
  /* 设置页 */
  var nb = document.getElementById('btnNbell');
  if(nb) nb.onclick = function(){ openNotifySheet(); };
  var np = document.getElementById('btnNperm');
  if(np) np.onclick = function(){
    if(!('Notification' in window)){ toast('当前设备不支持系统通知'); return; }
    Notification.requestPermission().then(function(p){
      if(p === 'granted'){
        toast('系统通知已开启', 3000);
        try{ new Notification('勤助任务榜', { body: '通知已开启：新任务发布、代班、验收消息会在这里提醒' }); }catch(e){}
      } else {
        toast('未开启，可稍后在设置里再试', 3000);
      }
      render();
    });
  };
  var lk = document.getElementById('lnkLeave');
  if(lk) lk.onclick = function(){ requireMe(function(){ openLeaveSheet(); }); };
  var ex = document.getElementById('btnExport');
  if(ex) ex.onclick = function(){ openExportSheet(); };
  var inpSch = document.getElementById('inpSch');
  if(inpSch) inpSch.onchange = function(){
    var f = inpSch.files && inpSch.files[0];
    var prev = document.getElementById('schPrev'), sv = document.getElementById('btnSchSave');
    var nm = document.getElementById('schName');
    if(nm) nm.textContent = f ? ('已选择：' + f.name) : '未选择文件';
    if(!f) return;
    prev.textContent = 'Excel 组件加载中…'; sv.style.display = 'none';
    loadXLSX().then(function(){
      prev.textContent = '解析中…';
      var rd = new FileReader();
      rd.onload = function(e){
        try{
          var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});

          wb.SheetNames.forEach(function(sn){ rows = rows.concat(XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:''})); });

      st.textContent = '拼装保存中…';

  var d = new Date(ts), p = function(x){ return (x < 10 ? '0' : '') + x; };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());

      var tasks = (state.board.tasks||[]).filter(function(t){ return (t.date||'').slice(0,7) === ym; })
        .sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : a.createdAt - b.createdAt; });
      if(!tasks.length){ toast(ym + ' 没有任务记录'); go.disabled = false; go.textContent = '生成并下载 Excel（含照片）'; return; }
      var keys = [];
      tasks.forEach(function(t){
        (t.photos||[]).forEach(function(k){ if(keys.indexOf(k) < 0) keys.push(k); });
        dlvsOf(t.id).forEach(function(d){ (d.photos||[]).forEach(function(k){ if(keys.indexOf(k) < 0) keys.push(k); }); });
      });
      var map = {};
      for(var i = 0; i < keys.length; i++){
        go.innerHTML = '<span class="spin"></span>取照片 ' + (i+1) + '/' + keys.length + '…';
        try{
          var r = await fetch('https://textdb.online/' + keys[i] + '?_=' + Date.now(), {cache:'no-store'});
          var tx = (await r.text()).trim();
          try{ var pj = JSON.parse(tx); if(typeof pj === 'string') tx = pj.trim(); }catch(e){}
          if(/^data:image/.test(tx)) map[keys[i]] = tx;
        }catch(e){}
      }
      go.innerHTML = '<span class="spin"></span>照片缩图嵌入中…';
      var shrink = function(uri, maxW){
        return new Promise(function(res){
          try{
            var img = new Image();
            img.onload = function(){
              try{
                var sc = Math.min(1, maxW / (img.width || maxW));
                var cv = document.createElement('canvas');
                cv.width = Math.max(1, Math.round(img.width * sc));
                cv.height = Math.max(1, Math.round(img.height * sc));
                var cx = cv.getContext('2d');
                cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
                cx.drawImage(img, 0, 0, cv.width, cv.height);
                res(cv.toDataURL('image/jpeg', 0.72));
              }catch(e){ res(uri); }
            };
            img.onerror = function(){ res(null); };
            img.src = uri;
          }catch(e){ res(null); }
        });
      };
      var b64of = function(uri){ var p = uri.indexOf(','); return p < 0 ? null : uri.slice(p + 1); };
      var shrunk = {};
      var sk = Object.keys(map);
      for(var si = 0; si < sk.length; si++){
        var sm = await shrink(map[sk[si]], 320);
        if(sm) shrunk[sk[si]] = sm;
      }
      go.innerHTML = '<span class="spin"></span>组表中…';
      var wb = new ExcelJS.Workbook();
      var ws = wb.addWorksheet('任务统计', {views: [{state:'frozen', ySplit:1}]});

        {header:'完成情况', width:18},{header:'交接说明', width:18},{header:'现场照片', width:22},
        {header:'验收状态', width:10},{header:'老师评语', width:20},{header:'交付时间', width:16},{header:'交付同学', width:10}
      ];
      var hrow = ws.getRow(1);
      hrow.height = 24;
      hrow.eachCell(function(c){
        c.font = {size:11, bold:true, color:{argb:'FFE8D9B0'}};
        c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF18243A'}};
        c.alignment = {vertical:'middle', horizontal:'center'};
        c.border = {top:{style:'thin', color:{argb:'FF5A4A2E'}}, left:{style:'thin', color:{argb:'FF5A4A2E'}}, bottom:{style:'thin', color:{argb:'FF5A4A2E'}}, right:{style:'thin', color:{argb:'FF5A4A2E'}}};
      });
      var picRowH = {};
      var addPics = function(row1, col0, ks){
        if(!ks || !ks.length) return;
        var added = 0;
        ks.forEach(function(k){
          if(!shrunk[k]) return;
          var b64 = b64of(shrunk[k]);
          if(!b64) return;
          var id = wb.addImage({base64: b64, extension: 'jpeg'});
          ws.addImage(id, {tl: {col: col0 + added * 2.4, row: row1 - 1}, ext: {width: 150, height: 112}});
          added++;
        });
        if(added) picRowH[row1] = Math.max(picRowH[row1] || 0, 90);
      };
      var ri = 1;
      tasks.forEach(function(t){
        var w = '周' + wk[new Date(t.date + 'T12:00:00').getDay()];
        var claims = claimNames(t).join('、');
        var ds = dlvsOf(t.id);
        if(!ds.length){
          ws.addRow([t.date, w, t.room||'', t.desc||'', '', claims, '', '', '', '', '', '', '']);
          ri++; addPics(ri, 4, t.photos);
        } else {
          ds.forEach(function(d){
            ws.addRow([t.date, w, t.room||'', t.desc||'', '', claims, d.result||'', d.note||'', '', (d.verified === 1 ? '验收通过' : (d.verified === 2 ? '已退回' : '待验收')), d.comment||'', fmtDT(d.at), d.student||'']);
            ri++; addPics(ri, 4, t.photos); addPics(ri, 8, d.photos);
          });
        }
      });
      Object.keys(picRowH).forEach(function(rn){ try{ ws.getRow(+rn).height = picRowH[rn]; }catch(e){} });
      go.innerHTML = '<span class="spin"></span>打包中…';
      var buf = await wb.xlsx.writeBuffer();
      var name = '整架岗任务统计_' + ym + '.xlsx';
      var bArr = new Uint8Array(buf);
      /* APP 内走原生保存（WebView 不支持 blob 下载） */
      if(window.Android && window.Android.saveFile){
        try{
          var s64 = ''; var CH = 0x8000;
          for(var pi = 0; pi < bArr.length; pi += CH){
            s64 += String.fromCharCode.apply(null, bArr.subarray(pi, Math.min(pi + CH, bArr.length)));
          }
          window.Android.saveFile(name, btoa(s64));
          mask.remove();
          toast('已保存到手机「下载」目录', 3600);
          return;
        }catch(e){}
      }
      var blob = new Blob([bArr], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      mask.remove();
      toast('已生成：' + name + '（照片已嵌入单元格）', 3400);
    }catch(e){
      console.warn(e);
      go.disabled = false; go.textContent = '生成并下载 Excel（含照片）';
      toast('生成失败：' + (e && e.message || e), 4000);
    }
  };
}

/* ---- 排班表解析（勤工助学岗位工作安排表样式） ---- */
function mapRoomRegion(r){
  if(/新书|报刊/.test(r)) return '新书阅览区';
  if(/电子/.test(r)) return '电子阅览室';
  if(/六楼/.test(r)) return '六楼东西南北';
  var south = /南/.test(r) || /区二/.test(r);
  if(/三楼/.test(r)) return south ? '三楼南自科阅览室2' : '三楼北自科阅览室1';
  if(/四楼/.test(r)) return south ? '四楼南社科阅览室4' : '四楼北社科阅览室3';
  if(/五楼/.test(r)) return south ? '五楼南社科阅览室2' : '五楼北社科阅览室1';
  return null;
}
function parseScheduleRows(rows){
  var out = {}, cur = null, cols = null;
  (rows||[]).forEach(function(row){
    var a = (row||[]).map(function(c){ return c == null ? '' : String(c).trim(); });
    var mt = (a[0]||'').match(/勤工助学岗位工作安排表（(.+?)）/);
    if(mt){ cur = mapRoomRegion(mt[1]) || mt[1]; cols = null; return; } /* 非阅览室岗位（如任务采集）按原名保留展示 */
    if(cur == null) return;
    if(a.join('|').indexOf('周一') >= 0){
      cols = a.map(function(c){
        return /周一/.test(c) ? 1 : /周二/.test(c) ? 2 : /周三/.test(c) ? 3 : /周四/.test(c) ? 4 : /周五/.test(c) ? 5 : -1;
      });
      return;
    }
    if(!cols) return;
    cols.forEach(function(d, ci){
      if(d < 0) return;
      var v = a[ci] || '';
      if(!v) return;
      var names = v.split(/[\n、,，\/\s]+/).map(function(s){ return s.trim(); }).filter(Boolean);
      if(!names.length) return;
      if(!out[cur]) out[cur] = {};
      out[cur][d] = names;
    });
  });
  return out;
}
async function opSaveSchedule(schedule){
  state.board.schedule = schedule;
  state.board.t_schedule = nowTs();
  /* 排班表名单自动生成账号（初始密码 320305） */
  state.board.accounts = state.board.accounts || {};
  rosterNames().forEach(function(n){
    if(!state.board.accounts[n]){
      state.board.accounts[n] = {p: DEFAULT_PWD, t: (state.board.teachers||[]).indexOf(n) >= 0 ? 1 : 0};
    }
  });
  state.__accDirty = true;
  state.dirty = true;
  addNotify('【排班】老师更新了本学期排班表，领任务请先看当班名单');
  await pushBoard();
}

/* ---- 完成反馈按钮：点击瞬间收缩成圆形，对勾一笔画出，震动 + 粒子迸发 ---- */
function btnDoneFx(btn){
  if(btn.dataset.fxBusy) return false;
  btn.dataset.fxBusy = '1';
  var w = btn.offsetWidth, h = btn.offsetHeight;
  btn.classList.add('donefx');
  btn.style.flex = 'none';
  btn.style.margin = '0 auto'; /* 行内居中，从两边收缩到中间 */
  btn.style.width = w + 'px';
  void btn.offsetWidth; /* 固定起始宽度，让收缩产生过渡动画 */
  btn.style.width = h + 'px';
  btn.style.height = h + 'px';
  btn.style.borderRadius = '50%';
  btn.classList.add('fx');
  try{ if(navigator.vibrate) navigator.vibrate([18, 40, 26]); }catch(e){}
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'dfx-svg');
  svg.setAttribute('viewBox', '0 0 26 26');
  svg.innerHTML = '<path d="M5 13.5 L10.8 19.2 L21 7.5"/>';
  btn.appendChild(svg);
  setTimeout(function(){
    var rc = btn.getBoundingClientRect();
    var cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2;
    var cols = ['#f0d491', '#e8cf9a', '#8fd8b8', '#fff3d6'];
    for(var i = 0; i < 10; i++){
      (function(i){
        var p = document.createElement('i');
        p.className = 'dfx-p';
        var ang = (Math.PI * 2 * i) / 10 + Math.random() * .5;
        var d = h * .66 + Math.random() * 16;
        p.style.left = cx + 'px'; p.style.top = cy + 'px';
        p.style.setProperty('--dx', (Math.cos(ang) * d).toFixed(0) + 'px');
        p.style.setProperty('--dy', (Math.sin(ang) * d).toFixed(0) + 'px');
        p.style.background = cols[i % cols.length];
        var sz = (3 + Math.random() * 3).toFixed(1);
        p.style.width = sz + 'px'; p.style.height = sz + 'px';
        document.body.appendChild(p);
        setTimeout(function(){ p.remove(); }, 720);
      })(i);
    }
  }, 250);
  return true;
}
function btnDoneReset(btn){
  btn.classList.remove('fx');
  btn.style.flex = ''; btn.style.margin = ''; btn.style.width = ''; btn.style.height = ''; btn.style.borderRadius = '';
  btn.querySelectorAll('.dfx-svg').forEach(function(e){ e.remove(); });
  delete btn.dataset.fxBusy;
}

    '<div class="f-label">任务说明照片（可选，指明区域）</div>' +
    '<div class="upl"><button class="btn" id="pbCam">📷 拍照</button><button class="btn" id="pbAlbum">🖼 相册</button></div>' +
    '<div class="thumbs" id="pbThumbs"></div>' +
    '<div class="hint">最多 9 张；照片自动压缩后上传。</div>' +
    '<div class="btnrow"><button class="btn primary" id="pbGo">发 布</button></div>'
  );
  var room = ROOMS[0], photos = [];
  mask.querySelectorAll('#pbRooms .rchip').forEach(function(b){
    b.onclick = function(){
      mask.querySelectorAll('#pbRooms .rchip').forEach(function(x){ x.classList.remove('on'); });

      room = b.dataset.r;
      mask.querySelector('#pbCustomWrap').style.display = room==='__custom' ? 'block' : 'none';
      pbDuty();
    };
  });
  var dateEl = mask.querySelector('#pbDate');
  function pbDuty(){
    var d = dateEl.value || todayStr();
    var r = room === '__custom' ? (mask.querySelector('#pbCustom').value.trim() || '自选阅览室') : room;
    var lst = dutyList(d, r);
    var el = mask.querySelector('#pbDuty');
    if(!el) return;
    if(lst === null) el.innerHTML = '『' + esc(r) + '』当日未排班（周末或未上传排班表），任务将开放给全体学生领取';
    else el.innerHTML = '『' + esc(r) + '』当日当班：' + (lst.length ? esc(lst.join('、')) + '（' + lst.length + ' 人）' : '无，全员可领取');
  }
  dateEl.onchange = pbDuty;
  var cwEl = mask.querySelector('#pbCustom');
  if(cwEl) cwEl.oninput = pbDuty;
  pbDuty();
  function addPhotos(list){
    photos = photos.concat(list).slice(0, 9);

    }).join('');
    mask.querySelectorAll('#pbThumbs .x').forEach(function(x){
      x.onclick = function(){ photos.splice(+x.dataset.i,1); addPhotos([]); };
    });
  }
  mask.querySelector('#pbCam').onclick = function(){ pickImages(true, false, addPhotos); };
  mask.querySelector('#pbAlbum').onclick = function(){ pickImages(false, true, addPhotos); };
  mask.querySelector('#pbGo').onclick = function(){
