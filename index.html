function openDeliverSheet(taskId, editDlv){
  var t = taskOf(taskId);
  if(!t){ toast('任务不存在或已删除'); pullBoard(); return; }
  var isT = isTeacher();
  var isEdit = !!editDlv;
  var mask = sheet(
    '<h3>' + (isEdit ? '【修改】交付记录' : '【交付】完成任务') + ' · ' + roomName(t.room) + '</h3>' +
    '<div class="sub">' + (isEdit ? '修改将覆盖上一次提交的内容，老师看到的是最新版本' : '整理完毕后，选择完成情况、拍摄现场照片，提交老师验收') + '</div>' +
    '<div class="f-label">任务完成情况</div><div class="seg" id="dlResult">' +
      RESULTS.map(function(r,i){ return '<button data-v="'+r+'" class="'+(i===0?'on':'')+'">'+r+'</button>'; }).join('') + '</div>' +
    '<div class="f-label">交接事项 / 特殊情况说明（无则填「无」）</div>' +
    '<textarea class="inp" id="dlNote" placeholder="例：已全部整理完毕；或：3排有破损书待处理"></textarea>' +
    '<div class="f-label">现场照片（必传 1-9 张）</div>' +
    '<div class="upl"><button class="btn" id="dlCam">📷 拍照</button>' + (isT ? '<button class="btn" id="dlAlbum">🖼 相册</button>' : '') + '</div>' +
    '<div class="thumbs" id="dlThumbs"></div>' +
    '<div class="hint">' + (isT ? '老师支持拍照或从相册导入；' : '照片须<b>现场拍摄</b>（学生不支持从相册导入）；') + '系统记录提交时间，早于 17:00 会提示老师核查。</div>' +
    '<div class="btnrow"><button class="btn primary" id="dlGo">' + (isEdit ? '提交修改' : '交付任务') + '</button></div>'
  );
  var result = RESULTS[0], photos = [];
  if(isEdit){
    result = editDlv.result || RESULTS[0];
    mask.querySelector('#dlNote').value = editDlv.note || '';
    mask.querySelectorAll('#dlResult button').forEach(function(b){
      b.classList.toggle('on', b.dataset.v === result);
    });
    if(editDlv.photos && editDlv.photos.length){
      toast('正在载入原照片…', 1500);
      Promise.all(editDlv.photos.map(function(k){ return resolvePhoto(k); })).then(function(list){
        if(!document.body.contains(mask)) return;
        addPhotos(list.filter(Boolean));
      });
    }
  }
  mask.querySelectorAll('#dlResult button').forEach(function(b){
    b.onclick = function(){
      result = b.dataset.v;
      mask.querySelectorAll('#dlResult button').forEach(function(x){ x.classList.toggle('on', x===b); });
    };
  });
  function addPhotos(list){
    photos = photos.concat(list).slice(0, 9);
    mask.querySelector('#dlThumbs').innerHTML = photos.map(function(p,i){
      return '<div class="thumb"><img src="'+p+'"><button class="x" data-i="'+i+'">✕</button></div>';
    }).join('');
    mask.querySelectorAll('#dlThumbs .x').forEach(function(x){
      x.onclick = function(){ photos.splice(+x.dataset.i,1); addPhotos([]); };
    });
  }
  mask.querySelector('#dlCam').onclick = function(){
    if(isT){ pickImages(true, false, addPhotos); return; }
    openCameraModal(addPhotos, function(){ pickImages(true, false, addPhotos); });
  };
  var dlAlbumBtn = mask.querySelector('#dlAlbum');
  if(dlAlbumBtn) dlAlbumBtn.onclick = function(){ pickImages(false, true, addPhotos); };
  mask.querySelector('#dlGo').onclick = function(){
    var note = mask.querySelector('#dlNote').value.trim();
    if(!photos.length){ toast('请至少上传 1 张现场照片'); return; }
    var go = mask.querySelector('#dlGo');
    if(!btnDoneFx(go)) return;
    setTimeout(async function(){
      try{
        var keys = await uploadImages(photos.slice());
        await opDeliver(taskId, result, note, keys, isEdit ? editDlv.id : undefined);
        mask.remove();
        toast(isEdit ? '修改已提交，老师看到的是最新版本' : '【系统】交付成功，积分 +5，待老师验收');
      }catch(e){
        console.warn(e);
        btnDoneReset(go);
        toast('网络不稳，照片不会丢。稍等几秒直接再点一次「交付」', 3500);
      }
    }, 820);
  };
}

/* 验收反馈：老师验收/退回时填写评语，学生端可见 */
function openVerifySheet(dlvId, isReject){
  var d = state.board.deliveries.find(function(x){ return x.id === dlvId; });
  if(!d){ toast('交付记录不存在'); render(); return; }
  var t = taskOf(d.taskId);
  var mask = sheet(
    '<h3>' + (isReject ? '【退回】确认退回' : '【验收】确认通过') + '</h3>' +
    '<div class="sub">' + esc(d.student || '同学') + ' · ' + (t ? esc(roomName(t.room)) : '') + ' 的交付</div>' +
    '<div class="f-label">' + (isReject ? '退回原因（学生可见，必填）' : '验收评语（学生可见，可不填）') + '</div>' +
    '<textarea class="inp" id="vfMsg" placeholder="' + (isReject ? '例：3-5 排仍有错架，请重新整理后再交付' : '例：整理到位，继续保持') + '"></textarea>' +
    '<div class="btnrow"><button class="btn primary" id="vfGo">' + (isReject ? '确认退回' : '确认通过（积分 +10）') + '</button></div>'
  );
  mask.querySelector('#vfGo').onclick = function(){
    var msg = mask.querySelector('#vfMsg').value.trim();
    if(isReject && !msg){ toast('请填写退回原因'); return; }
    var go = mask.querySelector('#vfGo');
    var launch = async function(){
      try{
        if(isReject){
          await opReject(dlvId, msg);
          mask.remove(); render();
          toast('【系统】已退回，' + (d.student || '同学') + ' 需重新交付');
        } else {
          showSeal('合格', '积分 +10');
          await opVerify(dlvId, msg);
          mask.remove(); render();
          toast('【系统】验收通过，' + (d.student || '同学') + ' 积分 +10');
        }
      }catch(e){
        console.warn(e);
        if(isReject){ go.disabled = false; go.textContent = '确认退回'; }
        else btnDoneReset(go);
        toast('网络不稳，稍后再试', 3000);
      }
    };
    if(isReject){
      go.disabled = true; go.innerHTML = '<span class="spin"></span>提交中…';
      launch();
    } else {
      if(!btnDoneFx(go)) return;
      setTimeout(launch, 820);
    }
  };
}
